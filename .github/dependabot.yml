version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Astro 本体と公式インテグレーションをまとめる
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      # expressive-code 関連をまとめる（密結合のため一括で確認したい）
      expressive-code:
        patterns:
          - "astro-expressive-code"
          - "@expressive-code/*"
      # remark/rehype プラグインをまとめる
      markdown:
        patterns:
          - "remark-*"
          - "rehype-*"
          - "mdast-*"
          - "hast-*"
          - "unified"
      # React 関連をまとめる
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Tailwind CSS 関連をまとめる
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      # テスト関連をまとめる
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
      # 上のどのグループにも入らない依存の minor/patch をまとめる（個別 PR 同士の lockfile 衝突を避けるため）
      # 先に定義したグループが優先されるので、必ず最後に置く。メジャー更新は個別 PR のまま
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # バージョン更新 PR の同時オープン上限（セキュリティアップデートはリポジトリ設定で有効化しており別枠）
    open-pull-requests-limit: 10

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
