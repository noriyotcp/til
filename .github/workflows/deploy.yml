name: Deploy to GitHub Pages

on:
  # mainブランチとastro-previewブランチにプッシュするたびにワークフローを実行します。
  push:
    branches: [ main ]
  # このワークフローをGitHubのActionsタブから手動で実行できるようにします。
  workflow_dispatch:

# このジョブがリポジトリをクローンし、ページデプロイメントを作成することを許可します。
permissions:
  contents: read
  pages: write
  id-token: write

# 短時間に複数push（例: 依存関係PRの連続マージ）が発生した場合、古い実行中のデプロイを
# キャンセルして最新のpushのみを反映する。cancel-in-progress: true により、無駄な
# デプロイの重複実行を防ぎつつ、常に最新のmainが速やかにデプロイされる。
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          path: . # リポジトリ内のAstroプロジェクトのルートロケーション
          node-version: 22 # サイト構築に使用するNodeのバージョン
          package-manager: npm # 依存関係のインストールとサイトのビルドに使用するNodeパッケージマネージャ

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
